name: Temporary Keshev PC chart regression checks
on:
  push:
    branches:
      - keshev-pc-visualization-20261102
    paths:
      - .github/workflows/keshev-pc-chart-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Test student module, offline DOM graph creation, and unavailable states
        shell: bash
        working-directory: on-client
        run: |
          node --check student/extension.mjs
          node --check src/pc-status.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createStudentView} from './student/extension.mjs';
          import {parseStudentAppearance} from './src/student-appearance.mjs';

          const appearance = parseStudentAppearance(await readFile('student/appearance.json'));
          assert.equal(appearance.ok, true);
          assert.equal(appearance.value.dashboardPreset,'student-first');
          class El {
            constructor(tag){this.tag=tag;this.children=[];this.attrs={};this.listeners={};this.textContent='';this.className='';this.value=0;this.max=1;this.disabled=false;}
            append(...children){this.children.push(...children);}
            appendChild(node){this.append(node);return node;}
            setAttribute(name,value){this.attrs[name]=String(value);}
            addEventListener(name,fn){this.listeners[name]=fn;}
            focus(){}
          }
          const all=(root,pred)=>!root||typeof root==='string'?[]:[...(pred(root)?[root]:[]),...(root.children??[]).flatMap(v=>all(v,pred))];
          const texts=root=>!root?'':typeof root==='string'?root:(root.textContent||'')+' '+(root.children??[]).map(texts).join(' ');
          let current;
          globalThis.document={
            createElement:tag=>new El(tag),
            createElementNS:(ns,tag)=>{assert.equal(ns,'http://www.w3.org/2000/svg');return new El(tag);},
            querySelector:sel=>sel==='[data-keshev-refresh]'?all(current,e=>e.attrs['data-keshev-refresh']!==undefined)[0]??null:null,
          };
          const stamp=delta=>new Date(Date.now()-delta).toISOString();
          const sample=({time,cpu,used,disk})=>({ok:true,data:{
            schema:'aleph.on.pc-status.v1',source:'local-pc',measuredAt:time,
            metrics:{
              cpu:{state:'ok',usagePercent:cpu,sampleMs:200},
              memory:{state:'ok',usedBytes:used*1073741824,totalBytes:16*1073741824},
              disk:disk===null?{state:'unavailable',reason:'permission_denied'}:{state:'ok',freeBytes:disk*1073741824,totalBytes:400*1073741824},
              network:{state:'ok',interfaceCount:2,ipv4Count:2},
              firewall:{state:'ok',profiles:['Domain','Private','Public'].map(name=>({name,enabled:true}))},
              events:{state:'ok',warningCount:3,errorCount:1,sampleLimit:5000,truncated:false}
            }}});
          let count=0;
          const replies=[
            sample({time:stamp(24000),cpu:30,used:4,disk:null}),
            sample({time:stamp(12000),cpu:40,used:5,disk:120}),
            {ok:false,error:{code:'NETWORK_ERROR'}},
          ];
          const input={mode:'disconnected',devices:{status:'loading'},sessions:{status:'loading'},notifications:[],diagnostics:{status:'idle'}};
          const view=createStudentView({api:{get:async path=>{assert.equal(path,'/api/pc/status');return replies[count++];}},onChange:()=>{current=view.renderStatus(input);}});
          for(const name of ['renderIdentity','renderDecision','renderEvents','renderStatus','renderVulnerabilities','renderAiConnection','renderExplanation','renderAction'])assert.equal(typeof view[name],'function',name);
          current=view.renderStatus(input);
          assert.equal(count,0,'no automatic fetch permitted');
          assert.equal(all(current,e=>e.tag==='progress').length,0,'no fake bars');
          assert.equal(all(current,e=>e.tag==='svg').length,0,'no fake graph');
          assert.match(texts(current),/SDP 미연결/);
          assert.match(texts(current),/침해 또는 공격 탐지 결과가 아닙니다/);
          const refresh=async()=>{const btn=all(current,e=>e.attrs['data-keshev-refresh']!==undefined)[0];assert.ok(btn);btn.listeners.click();await new Promise(resolve=>setTimeout(resolve,30));};
          await refresh();
          assert.match(texts(current),/CPU: 30.0% 사용/);
          assert.match(texts(current),/디스크: 확인 불가/);
          assert.match(texts(current),/일반 사용자 권한으로 읽을 수 없습니다/);
          assert.equal(all(current,e=>e.tag==='progress').length,2,'CPU+memory only, permission-denied disk must not have bar');
          assert.equal(all(current,e=>e.tag==='svg').length,0,'one sample insufficient');
          await refresh();
          const bars=all(current,e=>e.tag==='progress');
          assert.equal(bars.length,3);
          assert.equal(bars[0].value,40);
          assert.equal(bars[1].value,31.25);
          assert.equal(bars[2].value,30);
          assert.equal(all(current,e=>e.tag==='svg').length,2,'two charts required');
          assert.equal(all(current,e=>e.tag==='circle').length,4,'only actual samples');
          assert.match(texts(current),/CPU 변화: \+10.0 %p/);
          assert.match(texts(current),/메모리 사용량 변화: \+1.0 GB/);
          assert.match(texts(current),/2026|2025|2027/);
          assert.match(texts(current),/기록 · 최근 최대 8회/);
          const names=all(current,e=>e.tag==='svg').map(e=>e.attrs['aria-label']);
          assert.ok(names.some(v=>v?.includes('CPU 사용률')));
          assert.ok(names.some(v=>v?.includes('메모리 사용량')));
          await refresh();
          assert.equal(count,3);
          assert.equal(all(current,e=>e.tag==='progress').length,0,'new failed read removes current bars');
          assert.equal(all(current,e=>e.tag==='svg').length,2,'old graph remains but clearly historical');
          assert.match(texts(current),/현재 실측이 아닙니다/);
          assert.match(texts(current),/이번 조회 실패\(NETWORK_ERROR\)/);
          console.log('PASS: 0.2.21 appearance; 8 legacy renderers; 4 cards; 3 bars; 2 charts; no fake samples; permission-denied disk; history; failure behavior. No package command.');
          JS
