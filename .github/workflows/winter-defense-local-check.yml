name: Winter Defense Windows First Run
on:
  push:
    branches:
      - test/winter-defense-first-run-20261030
    paths:
      - .github/workflows/winter-defense-local-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-run:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use original Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Run student and PC unit checks
        id: unit
        working-directory: on-client
        continue-on-error: true
        run: |
          node --version
          npm run check
          node --test test/local-pc-status.test.mjs
      - name: Run Stage 7 fixture CLI at repository root
        id: fixture7
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          npm.cmd run fixture:7
          if($LASTEXITCODE -ne 0){throw ('FIXTURE7_FAILED: exit '+$LASTEXITCODE)}
      - name: Inspect deployed main with anonymous read-only GET requests
        id: publicapi
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'winter-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $script=Join-Path $env:RUNNER_TEMP 'winter-public-get.mjs'
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const out=path.join(process.env.GITHUB_WORKSPACE,'winter-evidence','public-read-only-api.json');
          // Exact public production host from aleph.config.json; no auth, cookies, tokens or write methods.
          const base='https://choi-bujang-secret-vault-eosin-zeta.vercel.app';
          const cases=[
            {stage:'1-4',path:'/aleph.json',expected:'200 deployment identity'},
            {stage:'1-4',path:'/data.json',expected:'404 or 410 static data absent'},
            {stage:'5',path:'/api/auth/session',expected:'200, user null without cookie'},
            {stage:'5',path:'/api/notes',expected:'401 no-cookie deny'},
            {stage:'5,8',path:'/api/notes/00000000-0000-4000-8000-000000000001',expected:'401 no-cookie deny'},
            {stage:'6,11',path:'/api/devices/status',expected:'anonymous status or denial (no approval)'},
            {stage:'6,11',path:'/api/devices',expected:'401 no-cookie deny'},
            {stage:'8',path:'/api/announcements?zoneId=unregistered',expected:'401 no-cookie deny'},
            {stage:'10',path:'/api/stage10/policy-diff',expected:'401 no-cookie deny'},
            {stage:'11-12',path:'/api/stage10/operations-status',expected:'401 no-cookie deny'}
          ];
          const records=[];
          for (const c of cases) {
            const record={stage:c.stage,method:'GET',path:c.path,expected:c.expected,checkedAt:new Date().toISOString(),
              source:'production-main-anonymous-get',deploymentShaExpected:'6d1772a4d1ed91c955e098a9e03e6b2813c68265'};
            try {
              const response=await fetch(new URL(c.path,base),{
                method:'GET',redirect:'manual',cache:'no-store',credentials:'omit',
                headers:{Accept:'application/json'},signal:AbortSignal.timeout(14000)
              });
              record.http=response.status;
              record.contentType=response.headers.get('content-type')?.split(';')[0]??null;
              // Only actual application-issued ID; do not relabel proxy / runner IDs as app request IDs.
              record.requestId=response.headers.get('x-request-id')??null;
              if(record.contentType==='application/json') {
                try{
                  const parsed=await response.json();
                  if(c.path==='/aleph.json' && parsed && typeof parsed==='object'){
                    record.alephCommit=typeof parsed.commit==='string'?parsed.commit:null;
                    record.alephStep=Number.isInteger(parsed.step)?parsed.step:null;
                  }
                  const error=parsed?.error;
                  if(typeof error==='string' && /^[A-Z][A-Z_]{2,79}$/.test(error))record.errorCode=error;
                  if(error && typeof error==='object' && typeof error.code==='string' && /^[A-Z][A-Z_]{2,79}$/.test(error.code))record.errorCode=error.code;
                  if(c.path==='/api/auth/session')record.noAuthenticatedUser=(parsed?.user===null);
                }catch{record.jsonParse='failed'}
              }else{await response.body?.cancel()}
              record.verdict='observed_http';
            }catch(error){
              record.verdict='no_http_response';
              record.networkError=error?.name??'UnknownError'; // No secrets or request body.
            }
            records.push(record);
            console.log('PUBLIC_GET '+JSON.stringify(record));
          }
          await fs.writeFile(out,JSON.stringify({description:'Actual anonymous GET from GitHub Actions Windows runner; no authenticated actor, no restore, no write operations',records},null,2));
          // No network errors hidden as HTTP status; the log remains evidence even when a request failed.
          '@ | Set-Content -Encoding utf8 $script
          & node $script
          if($LASTEXITCODE -ne 0){throw ('READONLY_API_PROBE_FAILED: exit '+$LASTEXITCODE)}
      - name: Verify anonymous write attempts are denied before mutation
        id: deniedwrites
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'winter-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $script=Join-Path $env:RUNNER_TEMP 'winter-denied-writes.mjs'
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const base='https://choi-bujang-secret-vault-eosin-zeta.vercel.app';
          // No token, cookie, Origin or valid mutation payload. Test ONLY the initial auth gate.
          const cases=[
            ['5','POST','/api/notes'],
            ['5,8','PUT','/api/notes/00000000-0000-4000-8000-000000000001'],
            ['5,8','DELETE','/api/notes/00000000-0000-4000-8000-000000000001'],
            ['8','POST','/api/announcements'],
            ['6,11','POST','/api/devices/register'],
            ['11','POST','/api/devices/approve'],
            ['11','POST','/api/devices/approve-self'],
            ['11-12','POST','/api/devices/revoke'],
            ['10','POST','/api/stage10/policy-restore'],
            ['10','POST','/api/stage10/memo-restore'],
            ['12','POST','/api/stage10/decision-check'],
            ['12','POST','/api/stage10/detection-check']
          ];
          const records=[];
          for(const [stage,method,route] of cases){
            const row={stage,method,path:route,checkedAt:new Date().toISOString(),source:'production-no-credentials-write-auth-gate',expected:'401/403 denied; no mutation requested',requestId:null};
            try{
              const response=await fetch(new URL(route,base),{
                method,body:method==='DELETE'?undefined:'{}',redirect:'manual',cache:'no-store',credentials:'omit',
                headers:{'Content-Type':'application/json',Accept:'application/json'},signal:AbortSignal.timeout(15000)
              });
              row.http=response.status;
              row.contentType=response.headers.get('content-type')?.split(';')[0]??null;
              row.requestId=response.headers.get('x-request-id')??null;
              if(row.contentType==='application/json'){
                try{
                  const json=await response.json();
                  if(typeof json?.error==='string'&&/^[A-Z][A-Z_]{2,79}$/.test(json.error))row.errorCode=json.error;
                }catch{row.jsonParse='failed'}
              }else{await response.body?.cancel()}
              row.verdict=(response.status===401||response.status===403)?'denied_as_expected':'unexpected_http_status';
            }catch(error){
              row.verdict='no_http_response';row.networkError=error.name??'NetworkError';
            }
            records.push(row);
            console.log('DENIED_WRITE '+JSON.stringify(row));
          }
          const evidenceFile=path.join(process.env.GITHUB_WORKSPACE,'winter-evidence','production-denied-write-attempts.json');
          await fs.writeFile(evidenceFile,JSON.stringify({scope:'No auth, no cookies, no Origin; request gate only; NO authenticated mutation test',records},null,2));
          if(records.some(r=>r.verdict!=='denied_as_expected'))throw Error('ANONYMOUS_WRITE_GATE_UNEXPECTED_RESULT');
          '@ | Set-Content -Encoding utf8 $script
          & node $script
          if($LASTEXITCODE -ne 0){throw ('DENIED_WRITE_PROBE_FAILED '+$LASTEXITCODE)}
      - name: Run isolated unmodified memo API handlers with in-memory A B
        id: isolatedab
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'winter-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $script=Join-Path $env:RUNNER_TEMP 'winter-isolated-handler.mjs'
          @'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createContext, SourceTextModule, SyntheticModule } from 'node:vm';
          const A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', B='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
          const idA='11111111-1111-4111-8111-111111111111', idB='22222222-2222-4222-8222-222222222222';
          const notes=[
            {id:idA,title:'synthetic-A',content:'synthetic-A',zone_id:'personal',owner_id:A},
            {id:idB,title:'synthetic-B',content:'synthetic-B',zone_id:'personal',owner_id:B}
          ];
          const observations=[];
          const mockDb={
            from(table){
              assert.equal(table,'learning_notes');
              const filters=[],data={operation:'select',newRow:null};
              const matching=()=>notes.filter(n=>filters.every(([k,v])=>n[k]===v));
              const q={
                select(){return q},
                eq(k,v){filters.push([k,v]);return q},
                order(){return Promise.resolve({data:matching(),error:null})},
                maybeSingle(){
                  const row=matching()[0]??null;
                  if(row&&data.operation==='update')Object.assign(row,data.newRow);
                  if(row&&data.operation==='delete')notes.splice(notes.indexOf(row),1);
                  return Promise.resolve({data:row?{...row}:null,error:null});
                },
                single(){
                  if(data.operation!=='insert')throw Error('UNSUPPORTED_MOCK_SINGLE');
                  const row={id:data.newRow.id??'33333333-3333-4333-8333-333333333333',...data.newRow};
                  notes.push(row);return Promise.resolve({data:{...row},error:null});
                },
                insert(row){data.operation='insert';data.newRow=row;return q},
                update(row){data.operation='update';data.newRow=row;return q},
                delete(){data.operation='delete';return q}
              };
              return q;
            }
          };
          const stubs={
            '../aleph.config.json':{default:{identityProvider:{issuer:'https://invalid.local'}}},
            '../../aleph.config.json':{default:{identityProvider:{issuer:'https://invalid.local'}}},
            '../src/resource-access.mjs':{
              requireResourceIdentity:async req=>({supabase:mockDb,identity:{userId:req.__syntheticUserId}}),
              requireZoneMembership:async (db,userId,zoneId,options={})=>{
                if(zoneId==='personal'&&!options.zoneType)return {zone:{zone_id:'personal'},membership:{user_id:userId,role:'student'}};
                if(zoneId==='section-fixture'&&options.zoneType==='section'&&!options.roles?.includes('instructor'))return {zone:{zone_id:'section-fixture'},membership:{user_id:userId,role:'student'}};
                return null;
              },
              sendResourceError:(res,status,error)=>res.status(status).json({error})
            },
            '../../src/resource-access.mjs':null,
            '../src/require-approved-device.mjs':{requireApprovedDevice:async()=>true},
            '../../src/require-approved-device.mjs':null,
            '../src/resource-id.mjs':{
              formatResourceId:(type,id)=>type+':'+id
            },
            '../../src/resource-id.mjs':{
              formatResourceId:(type,id)=>type+':'+id,
              parseResourceId:(raw,type)=>{
                if(typeof raw!=='string')return null;
                const id=raw.startsWith(type+':')?raw.slice(type.length+1):raw;
                return /^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id)?id:null;
              }
            }
          };
          stubs['../../src/resource-access.mjs']=stubs['../src/resource-access.mjs'];
          stubs['../../src/require-approved-device.mjs']=stubs['../src/require-approved-device.mjs'];
          const ctx=createContext({});
          async function load(file){
            const source=await fs.readFile(file,'utf8');
            const module=new SourceTextModule(source,{identifier:file,context:ctx});
            await module.link(async spec=>{
              const exported=stubs[spec];if(!exported)throw Error('UNMOCKED_DEPENDENCY '+spec);
              return new SyntheticModule(Object.keys(exported),function(){
                for(const [k,v] of Object.entries(exported))this.setExport(k,v);
              },{context:ctx});
            });
            await module.evaluate();
            return module.namespace.default;
          }
          const list=await load('api/notes.js');
          const item=await load('api/notes/[id].js');
          const announcements=await load('api/announcements.js');
          function makeRes(){
            return {statusCode:200,body:null,headers:{},setHeader(k,v){this.headers[k]=v;return this},
              status(code){this.statusCode=code;return this},json(value){this.body=value;return this},end(){return this}};
          }
          async function run(label,handler,user,method,route,id,body,expected){
            const res=makeRes();
            const req={method,url:route,headers:{},query:id?{id}:{},body,__syntheticUserId:user};
            await handler(req,res);
            observations.push({name:label,method,path:route,actor:user===A?'A-synthetic':'B-synthetic',http:res.statusCode,
              errorCode:res.body?.error??null,recordCount:notes.length,checkedAt:new Date().toISOString(),
              source:'isolated-handler-memory-stub-not-production'});
            assert.equal(res.statusCode,expected,label);
            console.log('ISOLATED_HANDLER '+JSON.stringify(observations.at(-1)));
            return res;
          }
          await run('A owns A read',item,A,'GET','/api/notes/'+idA,idA,null,200);
          await run('B cannot read A',item,B,'GET','/api/notes/'+idA,idA,null,404);
          await run('A cannot read B',item,A,'GET','/api/notes/'+idB,idB,null,404);
          await run('B cannot edit A',item,B,'PUT','/api/notes/'+idA,idA,{title:'tampered',body:'tampered'},404);
          await run('B cannot delete A',item,B,'DELETE','/api/notes/'+idA,idA,null,404);
          assert.equal(notes.find(n=>n.id===idA)?.content,'synthetic-A','A content unchanged by B');
          const listA=await run('A own list',list,A,'GET','/api/notes',null,null,200);
          assert.deepEqual(listA.body.map(n=>n.id),[idA]);
          const listB=await run('B own list',list,B,'GET','/api/notes',null,null,200);
          assert.deepEqual(listB.body.map(n=>n.id),[idB]);
          await run('Student cannot write announcement',announcements,A,'POST','/api/announcements',null,{zoneId:'section-fixture',title:'synthetic',content:'synthetic'},403);
          await run('A updates own memo',item,A,'PUT','/api/notes/'+idA,idA,{title:'synthetic-A2',body:'synthetic-A2'},200);
          assert.equal(notes.find(n=>n.id===idA)?.content,'synthetic-A2');
          await run('A creates own memo',list,A,'POST','/api/notes',null,{title:'synthetic-A3',body:'synthetic-A3'},201);
          assert.equal(notes.length,3);
          await run('A removes own memo',item,A,'DELETE','/api/notes/'+idA,idA,null,204);
          assert.equal(notes.some(n=>n.id===idA),false);
          assert.equal(notes.find(n=>n.id===idB)?.content,'synthetic-B','B unchanged');
          const file=path.join(process.env.GITHUB_WORKSPACE,'winter-evidence','isolated-owner-handler-results.json');
          await fs.writeFile(file,JSON.stringify({method:'Original unmodified api/notes.js, api/notes/[id].js and api/announcements.js via Node VM with synthetic auth and in-memory DB; does NOT prove real auth, cookies, Supabase RLS or production',records:observations},null,2));
          console.log('ISOLATED_HANDLER_SUMMARY '+JSON.stringify({tests:observations.length,passed:observations.length,db:'in-memory-only'}));
          '@ | Set-Content -Encoding utf8 $script
          & node --experimental-vm-modules $script
          if($LASTEXITCODE -ne 0){throw ('ISOLATED_HANDLER_FAILED '+$LASTEXITCODE)}
      - name: Start real localhost service and check HTTP
        id: http
        working-directory: on-client
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'winter-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $env:ON_PORT='5190'
          $s=Start-Process -FilePath (Get-Command node).Source -ArgumentList 'src/server.mjs' -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput (Join-Path $evidence 'server-out.log') -RedirectStandardError (Join-Path $evidence 'server-error.log')
          Set-Content (Join-Path $env:RUNNER_TEMP 'winter-server.pid') $s.Id
          $base='http://127.0.0.1:5190'
          $ready=$false
          for($i=0;$i -lt 25;$i++){
            Start-Sleep -Seconds 1
            try { $x=Invoke-WebRequest -Uri $base -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 3; if($x.StatusCode -eq 200){$ready=$true;break} } catch {}
            if($s.HasExited){throw 'SERVER_EXITED: read server-error.log'}
          }
          if(-not $ready){throw 'SERVER_START_TIMEOUT: localhost:5190 did not become ready'}
          $results=@()
          foreach($route in @('/','/index.html','/app.js','/style.css','/student/extension.mjs','/api/diagnostics','/api/me','/api/local-pc-status')){
            try {
              $r=Invoke-WebRequest -Uri ($base+$route) -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 30
              $row=[ordered]@{path=$route;http=[int]$r.StatusCode}
              if($route.StartsWith('/api/')){
                $j=$r.Content|ConvertFrom-Json
                $row.ok=$j.ok
                $row.mode=$j.meta.mode
                if($j.error){$row.errorCode=$j.error.code;$row.errorMessage=$j.error.message}
                if($route -eq '/api/local-pc-status'){
                  $row.source=$j.data.source
                  $row.cpu=$j.data.cpu.status
                  $row.memory=$j.data.memory.status
                  $row.disk=$j.data.disk.status
                  $row.cpuReason=$j.data.cpu.reason
                  $row.memoryReason=$j.data.memory.reason
                  $row.diskReason=$j.data.disk.reason
                  $row.cpuMeasuredAt=$j.data.cpu.measuredAt
                  $row.memoryMeasuredAt=$j.data.memory.measuredAt
                  $row.diskMeasuredAt=$j.data.disk.measuredAt
                }
              }
              $results += $row
              Write-Host ($row|ConvertTo-Json -Compress)
            }catch{
              $results += [ordered]@{path=$route;error=$_.Exception.Message}
              Write-Host ('REQUEST_FAILED '+$route+' '+$_.Exception.Message)
            }
          }
          $results|ConvertTo-Json -Depth 6|Set-Content -Encoding utf8 (Join-Path $evidence 'http-results.json')
          foreach($route in @('/','/index.html','/app.js','/style.css','/student/extension.mjs')){
            if(-not @($results|Where-Object { $_.path -eq $route -and $_.http -eq 200 }).Count){throw ('STATIC_GET_FAILED '+$route)}
          }
          if(-not @($results|Where-Object {$_.path -eq '/api/local-pc-status' -and $_.http -eq 200 -and $_.ok -eq $true -and $_.source -eq 'local-windows'}).Count){throw 'PC_READ_ENDPOINT_FAILED'}
          if(@($results|Where-Object {$_.path -eq '/api/me' -and $_.http -eq 200}).Count){throw 'SDP_FALSE_CONNECTED'}
      - name: Browser visit screenshot and keyboard refresh
        id: browser
        working-directory: on-client
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:GITHUB_WORKSPACE 'winter-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          # Runner may terminate child processes after each step; start the Node host in THIS browser step.
          $env:ON_PORT='5190'
          $localReady=$false
          try {
            $test=Invoke-WebRequest -Uri 'http://127.0.0.1:5190/' -UseBasicParsing -TimeoutSec 3 -SkipHttpErrorCheck
            $localReady=($test.StatusCode -eq 200)
          } catch { }
          if(-not $localReady) {
            $server=Start-Process -FilePath (Get-Command node).Source -ArgumentList 'src/server.mjs' -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput (Join-Path $evidence 'browser-server-out.log') -RedirectStandardError (Join-Path $evidence 'browser-server-error.log')
            Set-Content (Join-Path $env:RUNNER_TEMP 'winter-server.pid') $server.Id
            for($i=0;$i -lt 25;$i++){
              Start-Sleep -Seconds 1
              try {
                $test=Invoke-WebRequest -Uri 'http://127.0.0.1:5190/' -UseBasicParsing -TimeoutSec 3 -SkipHttpErrorCheck
                if($test.StatusCode -eq 200){$localReady=$true;break}
              } catch {}
              if($server.HasExited){throw 'BROWSER_SERVER_EXITED'}
            }
          }
          if(-not $localReady){throw 'BROWSER_SERVER_START_TIMEOUT'}
          Write-Host 'BROWSER_LOCAL_SERVER_READY HTTP 200'
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $b=@(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $pf86 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $pf86 'Microsoft\Edge\Application\msedge.exe')
          )|Where-Object {Test-Path $_}|Select-Object -First 1
          if(-not $b){throw 'BROWSER_NOT_FOUND'}
          Write-Host ('BROWSER '+$b)
          $profile=Join-Path $env:RUNNER_TEMP 'winter-cdp-profile'
          $browser=Start-Process -FilePath $b -ArgumentList @('--headless=new','--no-first-run','--disable-gpu','--disable-background-networking','--remote-allow-origins=*','--remote-debugging-port=9222',"--user-data-dir=$profile",'about:blank') -PassThru
          Set-Content (Join-Path $env:RUNNER_TEMP 'winter-browser.pid') $browser.Id
          $ready=$false
          for($i=0;$i -lt 20;$i++){
            Start-Sleep -Seconds 1
            try{$v=Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2;if($v.Browser){$ready=$true;break}}catch{}
          }
          if(-not $ready){throw 'BROWSER_DEBUG_PORT_TIMEOUT'}
          $script=Join-Path $env:RUNNER_TEMP 'winter-browser.mjs'
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const evidence=path.join(process.env.GITHUB_WORKSPACE,'winter-evidence');
          const targets=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=targets.find(x=>x.type==='page'&&x.webSocketDebuggerUrl);
          if(!target)throw Error('BROWSER_TARGET_MISSING');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((yes,no)=>{
            const timer=setTimeout(()=>no(Error('BROWSER_WEBSOCKET_TIMEOUT')),10000);
            ws.addEventListener('open',()=>{clearTimeout(timer);yes()},{once:true});
            ws.addEventListener('error',()=>{clearTimeout(timer);no(Error('BROWSER_WEBSOCKET_FAILED'))},{once:true});
          });
          let id=0;const pending=new Map();
          ws.addEventListener('message',event=>{
            const p=JSON.parse(event.data);const t=pending.get(p.id);
            if(t){pending.delete(p.id);clearTimeout(t.timer);p.error?t.reject(Error(p.error.message)):t.resolve(p.result)}
          });
          const call=(method,params={})=>new Promise((resolve,reject)=>{
            const key=++id,timer=setTimeout(()=>{pending.delete(key);reject(Error('CDP_TIMEOUT '+method))},20000);
            pending.set(key,{resolve,reject,timer});ws.send(JSON.stringify({id:key,method,params}));
          });
          const evalInPage=async expression=>{
            const p=await call('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            if(p.exceptionDetails)throw Error('BROWSER_SCRIPT_ERROR '+p.exceptionDetails.text);
            return p.result?.value;
          };
          const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
          const snapshot='(()=>({title:document.title,cards:document.querySelectorAll(".pc-card").length,heading:document.querySelector("#pc-dashboard-title")?.textContent,cpu:document.querySelector("#pc-cpu-value")?.textContent,memory:document.querySelector("#pc-memory-value")?.textContent,disk:document.querySelector("#pc-disk-value")?.textContent,health:document.querySelector("#pc-health-value")?.textContent,mode:document.querySelector("#mode-badge")?.textContent,history:document.querySelector("#pc-history-body")?.textContent?.slice(0,250)}))()';
          try{
            await call('Page.enable');
            await call('Runtime.enable');
            await call('Emulation.setDeviceMetricsOverride',{width:1440,height:1100,deviceScaleFactor:1,mobile:false});
            await call('Page.navigate',{url:'http://127.0.0.1:5190/'});
            await sleep(8500);
            const before=await evalInPage(snapshot);
            await fs.writeFile(path.join(evidence,'browser-before.json'),JSON.stringify(before,null,2));
            const shot=await call('Page.captureScreenshot',{format:'png',captureBeyondViewport:true});
            await fs.writeFile(path.join(evidence,'winter-defense-first-run.png'),Buffer.from(shot.data,'base64'));
            const focus=await evalInPage('(()=>{const b=document.querySelector("#refresh");b.focus();return document.activeElement===b&&!b.disabled})()');
            if(!focus)throw Error('KEYBOARD_BUTTON_NOT_FOCUSABLE');
            await call('Input.dispatchKeyEvent',{type:'keyDown',key:'Enter',code:'Enter',windowsVirtualKeyCode:13});
            await call('Input.dispatchKeyEvent',{type:'keyUp',key:'Enter',code:'Enter',windowsVirtualKeyCode:13});
            await sleep(6500);
            const after=await evalInPage(snapshot);
            await fs.writeFile(path.join(evidence,'browser-after-keyboard.json'),JSON.stringify({keyboardFocus:focus,...after},null,2));
            const shot2=await call('Page.captureScreenshot',{format:'png',captureBeyondViewport:true});
            await fs.writeFile(path.join(evidence,'winter-defense-after-refresh.png'),Buffer.from(shot2.data,'base64'));
            console.log('BEFORE '+JSON.stringify(before));
            console.log('AFTER_KEYBOARD '+JSON.stringify(after));
            if(before.cards!==4)throw Error('FOUR_CARDS_NOT_FOUND');
            if(!before.heading?.includes('내 PC 상태'))throw Error('DASHBOARD_HEADING_NOT_FOUND');
            if(!before.mode?.includes('연결 없음'))throw Error('SDP_DISCONNECTED_NOT_SHOWN');
            if(after.cards!==4)throw Error('DASHBOARD_LOST_AFTER_REFRESH');
          }finally{ws.close()}
          '@|Set-Content -Encoding utf8 $script
          & node $script
          if($LASTEXITCODE -ne 0){throw ('BROWSER_TEST_EXIT '+$LASTEXITCODE)}
      - name: Stop temporary processes
        if: always()
        run: |
          foreach($name in @('winter-browser.pid','winter-server.pid')){
            $file=Join-Path $env:RUNNER_TEMP $name
            if(Test-Path $file){$value=(Get-Content $file -Raw).Trim();if($value -match '^[0-9]+$'){Stop-Process -Id ([int]$value) -ErrorAction SilentlyContinue}}
          }
      - name: Upload actual logs and browser PNGs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winter-defense-first-run-evidence
          path: winter-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Mark workflow unsuccessful if any check failed
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          HTTP_RESULT: ${{ steps.http.outcome }}
          FIXTURE7_RESULT: ${{ steps.fixture7.outcome }}
          PUBLICAPI_RESULT: ${{ steps.publicapi.outcome }}
          DENIED_WRITES_RESULT: ${{ steps.deniedwrites.outcome }}
          ISOLATED_AB_RESULT: ${{ steps.isolatedab.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: |
          Write-Host "Unit: $env:UNIT_RESULT; fixture7: $env:FIXTURE7_RESULT; publicApi: $env:PUBLICAPI_RESULT; deniedWrites: $env:DENIED_WRITES_RESULT; isolatedAB: $env:ISOLATED_AB_RESULT; HTTP: $env:HTTP_RESULT; Browser: $env:BROWSER_RESULT"
          if($env:UNIT_RESULT -ne 'success' -or $env:FIXTURE7_RESULT -ne 'success' -or $env:PUBLICAPI_RESULT -ne 'success' -or $env:DENIED_WRITES_RESULT -ne 'success' -or $env:ISOLATED_AB_RESULT -ne 'success' -or $env:HTTP_RESULT -ne 'success' -or $env:BROWSER_RESULT -ne 'success') {
            throw 'FIRST_RUN_INCOMPLETE: inspect previous step logs and artifact'
          }
