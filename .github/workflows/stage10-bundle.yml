name: Stage 10 submission bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage10-bundle.yml
      - aleph.config.json
      - README.md
      - src/detect.mjs
      - docs/DETECT_EVENTS.md
      - scripts/detect-test.mjs
      - package.json
      - package-lock.json
      - src/attack-check.mjs
      - src/stage10-recovery.mjs
      - src/stage10-recovery-api.mjs
      - scripts/bundle.mjs
      - scripts/stage10-test.mjs
      - api/stage10/**
      - supabase/migrations/**
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out saved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run detector contract tests
        run: npm run detect:test
      - name: Prepare local ignored bundle notes
        run: |
          cat > bundle-notes.json <<'JSON'
          {
            "explanation": "12단계에서는 세 읽기 전용 GET을 alephEvidence.caseId/requestKey로 연결합니다. fetch가 응답을 반환하면 본문 읽기에 실패해도 실제 HTTP 상태를 observed에 보존하고, 읽지 못한 본문 길이는 unavailable로 명시합니다. 요청은 시도했지만 HTTP 응답이 없으면 no_http_response, 전송하지 않은 POST·PUT·DELETE만 not_run으로 기록합니다. 응답 본문과 화면 코드는 수정하지 않았습니다."
          }
          JSON
      - name: Run submission bundle checks
        run: npm run bundle
      - name: Print submission JSON and summary
        run: |
          cat artifacts/submission.json
          echo
          echo "Bundle file size:"
          wc -c artifacts/submission.json
      - name: Upload generated bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage10-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 7
