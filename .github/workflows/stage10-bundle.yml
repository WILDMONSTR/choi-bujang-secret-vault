name: Stage 10 submission bundle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage10-bundle.yml
      - aleph.config.json
      - README.md
      - src/detect.mjs
      - docs/DETECT_EVENTS.md
      - scripts/detect-test.mjs
      - package.json
      - package-lock.json
      - src/attack-check.mjs
      - src/stage10-recovery.mjs
      - src/stage10-recovery-api.mjs
      - scripts/bundle.mjs
      - scripts/stage10-test.mjs
      - api/stage10/**
      - supabase/migrations/**
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out saved commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run detector contract tests
        run: npm run detect:test
      - name: Prepare local ignored bundle notes
        run: |
          cat > bundle-notes.json <<'JSON'
          {
            "explanation": "12단계 저장점에서는 anonymous_static_data_read, anonymous_notes_list, anonymous_note_read의 실제 GET을 심판의 alephEvidence.caseId/requestKey 메타데이터로 연결합니다. observed에는 받은 HTTP 상태, GET 메서드, 요청 URL의 SHA-256, 응답 본문 바이트 수만 기록하며 본문은 기록하지 않습니다. HTTP 응답을 받지 못한 요청과 전송하지 않은 POST·PUT·DELETE는 not_run으로 남기고 화면 코드는 수정하지 않았습니다."
          }
          JSON
      - name: Run submission bundle checks
        run: npm run bundle
      - name: Print submission JSON and summary
        run: |
          cat artifacts/submission.json
          echo
          echo "Bundle file size:"
          wc -c artifacts/submission.json
      - name: Upload generated bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage10-submission
          path: artifacts/submission.json
          if-no-files-found: error
          retention-days: 7
