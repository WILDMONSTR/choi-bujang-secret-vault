name: Stage 11 security checks

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'test/**'
      - 'supabase/migrations/**'
      - 'aleph.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'package/baseline-functions.json'
      - '.github/workflows/stage11-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test device request signatures and tampering
        run: npm run device:test
      - name: Test stage 11 PWA and approval wiring
        run: npm run stage11:test
      - name: Run existing regression tests
        run: |
          npm run decider:test
          npm run resource-id:test
          npm run detect:test
          npm run stage10:test
          npm run test:r5
          npm run test:package
      - name: Check local production build
        run: npm run build -- --local

  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without package lifecycle scripts
        run: npm.cmd ci --ignore-scripts
      - name: Test device request signatures and tampering
        run: npm.cmd run device:test
      - name: Test stage 11 PWA and approval wiring
        run: npm.cmd run stage11:test
      - name: Test decision contract
        run: npm.cmd run decider:test
      - name: Test resource IDs
        run: npm.cmd run resource-id:test
      - name: Test event detector
        run: npm.cmd run detect:test
      - name: Test stage 10 recovery
        run: npm.cmd run stage10:test
      - name: Run existing regression tests
        run: npm.cmd run test:r5
      - name: Run package checks
        run: npm.cmd run test:package
      - name: Check local production build
        run: npm.cmd run build -- --local
