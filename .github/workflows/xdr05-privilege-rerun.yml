name: XDR-05 privilege result refresh

on:
  push:
    branches: [verify/xdr-05-decide-refresh]
    paths:
      - '.github/workflows/xdr05-privilege-rerun.yml'
      - 'xdr/privilege/decide.mjs'

permissions:
  contents: write

jobs:
  run-privilege-xdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run requested command
        run: npm run xdr:run -- privilege
      - name: Validate result contract and print per-alert outcomes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const fixture = JSON.parse(readFileSync('xdr/fixtures/privilege.json', 'utf8'));
          const result = JSON.parse(readFileSync('xdr/privilege/result.json', 'utf8'));
          const expectedIds = fixture.alerts.map(a => a.id);
          const actualIds = result.decisions.map(d => d.alertId);
          if (result.moduleKey !== 'privilege' || expectedIds.length !== actualIds.length || JSON.stringify(expectedIds) !== JSON.stringify(actualIds)) {
            throw new Error('Fixture/result alert IDs or order mismatch');
          }
          for (const d of result.decisions) {
            const action = d.confidence >= 0.85 ? 'block' : d.confidence >= 0.5 ? 'alert' : 'record';
            if (d.action !== action) throw new Error(d.alertId + ': action/confidence mismatch');
            console.log(d.alertId + '\t' + d.action + '\t' + d.confidence + '\t' + d.reason);
          }
          const normalIds = ['pv-11','pv-12','pv-13','pv-15','pv-17','pv-18','pv-19','pv-20','pv-21','pv-22','pv-23','pv-24','pv-25','pv-26'];
          for (const id of normalIds) {
            const d = result.decisions.find(x => x.alertId === id);
            if (!d || d.action !== 'record') throw new Error(id + ': expected normal event to remain record');
          }
          const oneGroupAdd = result.decisions.find(x => x.alertId === 'pv-01');
          if (!oneGroupAdd || oneGroupAdd.action !== 'alert') throw new Error('pv-01 single admin-group addition should not block by itself');
          const counts = result.counts;
          console.log('COUNTS: block ' + counts.block + ' / alert ' + counts.alert + ' / record ' + counts.record);
          console.log('VERIFIED: ' + actualIds.length + ' fixture alerts; known normal events record; standalone group addition alert.');
          NODE
      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xdr/privilege/result.json
          git commit -m "Refresh privilege XDR result after classification fix"
          git push
