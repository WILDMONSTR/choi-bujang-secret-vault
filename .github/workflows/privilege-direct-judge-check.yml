name: Temporary privilege judge check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/privilege-direct-judge-check.yml'
      - 'xdr/privilege/decide.mjs'
      - 'test/privilege.test.mjs'
  push:
    branches: [fix/privilege-decide-per-alert]
    paths:
      - '.github/workflows/privilege-direct-judge-check.yml'
      - 'xdr/privilege/decide.mjs'
      - 'test/privilege.test.mjs'

permissions:
  contents: read

jobs:
  privilege-direct-judge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run privilege tests
        run: npm run privilege:test
      - name: Run requested XDR command
        run: npm run xdr:run -- privilege
      - name: Verify every fixture classification and counts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { decide } from './xdr/privilege/decide.mjs';
          const fixture = JSON.parse(readFileSync('xdr/fixtures/privilege.json', 'utf8'));
          const result = JSON.parse(readFileSync('xdr/privilege/result.json', 'utf8'));
          const expected = new Map([
            ['pv-01', 'alert'], ['pv-02', 'block'], ['pv-03', 'alert'],
            ['pv-04', 'block'], ['pv-05', 'block'], ['pv-06', 'alert'],
            ['pv-07', 'block'], ['pv-08', 'alert'], ['pv-09', 'alert'],
            ['pv-10', 'alert'], ['pv-11', 'record'], ['pv-12', 'record'],
            ['pv-13', 'record'], ['pv-14', 'alert'], ['pv-15', 'record'],
            ['pv-16', 'alert'], ['pv-17', 'record'], ['pv-18', 'record'],
            ['pv-19', 'record'], ['pv-20', 'record'], ['pv-21', 'record'],
            ['pv-22', 'record'], ['pv-23', 'record'], ['pv-24', 'record'],
            ['pv-25', 'record'], ['pv-26', 'record']
          ]);
          const counts = { block: 0, alert: 0, record: 0 };
          for (const alert of fixture.alerts) {
            const direct = decide(alert);
            if (direct.action !== expected.get(alert.id)) throw new Error(alert.id + ': expected ' + expected.get(alert.id) + ', got ' + direct.action);
            const generated = result.decisions.find(item => item.alertId === alert.id);
            if (!generated || generated.action !== expected.get(alert.id)) throw new Error(alert.id + ': generated result mismatch');
            const fromConfidence = direct.confidence >= 0.85 ? 'block' : direct.confidence >= 0.5 ? 'alert' : 'record';
            if (direct.action !== fromConfidence) throw new Error(alert.id + ': confidence threshold mismatch');
            counts[direct.action]++;
          }
          if (JSON.stringify(counts) !== JSON.stringify({ block: 4, alert: 8, record: 14 })) throw new Error('Count mismatch: ' + JSON.stringify(counts));
          console.log('Verified 26 fixture alerts against per-alert expected actions.');
          console.log('Counts:', JSON.stringify(counts));
          NODE
