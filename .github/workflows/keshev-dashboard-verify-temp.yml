name: One-time student dashboard functional verification
on:
  push:
    branches:
      - keshev-dashboard-last-six-20261102
    paths:
      - .github/workflows/keshev-dashboard-verify-temp.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Existing student syntax, appearance schema, and dashboard behavior
        shell: bash
        working-directory: on-client
        run: |
          node --version
          npm run check
          node --check student/engine-adapter.mjs
          node --check src/pc-status.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createStudentView} from './student/extension.mjs';
          import {parseStudentAppearance} from './src/student-appearance.mjs';
          const config = parseStudentAppearance(await readFile('student/appearance.json'));
          assert.equal(config.ok, true, JSON.stringify(config.problem));
          assert.equal(config.value.appName, '겨울철방어');
          assert.equal(config.value.dashboardPreset, 'student-first');
          class Element {
            constructor(tag) {this.tag=tag; this.children=[]; this.listeners={}; this.attributes={}; this.className='';this.textContent='';this.disabled=false;}
            append(...children){this.children.push(...children);}
            appendChild(child){this.append(child);return child;}
            setAttribute(name,value){this.attributes[name]=value;}
            addEventListener(type,callback){this.listeners[type]=callback;}
            focus(){}
          }
          let current;
          globalThis.document={
            createElement:tag=>new Element(tag),
            querySelector:query=>query==='[data-keshev-refresh]'?find(current,n=>n.attributes?.['data-keshev-refresh']!==undefined):null
          };
          const find=(root,pred)=>{
            if (!root || typeof root==='string') return null;
            if(pred(root))return root;
            for(const child of root.children??[]){const found=find(child,pred);if(found)return found;}
            return null;
          };
          const textOf=root=>!root?'':typeof root==='string'?root:(root.textContent||'')+' '+(root.children??[]).map(textOf).join(' ');
          const make=({at,cpu,memory})=>({ok:true,data:{schema:'aleph.on.pc-status.v1',source:'local-pc',measuredAt:at,
            metrics:{cpu:{state:'ok',usagePercent:cpu,sampleMs:200},
              memory:{state:'ok',usedBytes:memory*1073741824,totalBytes:16*1073741824},
              disk:{state:'unavailable',reason:'permission_denied'},
              network:{state:'ok',interfaceCount:2,ipv4Count:2},
              firewall:{state:'ok',profiles:['Domain','Private','Public'].map(name=>({name,enabled:true}))},
              events:{state:'ok',warningCount:3,errorCount:1,truncated:false,sampleLimit:5000,since:new Date(Date.now()-86400000).toISOString()}
            }}});
          const replies=[
            make({at:new Date(Date.now()-20000).toISOString(),cpu:30,memory:4}),
            make({at:new Date(Date.now()-10000).toISOString(),cpu:40,memory:5}),
            {ok:false,error:{code:'NETWORK_ERROR'}},
          ];
          let calls=0;
          const input={mode:'disconnected',devices:{status:'loading'},sessions:{status:'loading'},notifications:[],diagnostics:{status:'idle'}};
          const student=createStudentView({api:{get:async p=>{assert.equal(p,'/api/pc/status');return replies[calls++];}},
            onChange:()=>{current=student.renderStatus(input);}});
          for(const name of ['renderIdentity','renderDecision','renderEvents','renderStatus','renderVulnerabilities','renderAiConnection','renderExplanation','renderAction']) assert.equal(typeof student[name],'function',name);
          current=student.renderStatus(input);
          assert.equal(calls,0,'must not fetch automatically');
          assert.match(textOf(current),/다시 조회/);
          assert.match(textOf(current),/SDP 미연결/);
          assert.match(textOf(current),/침해 또는 공격 탐지 결과가 아닙니다/);
          const press=async()=>{find(current,n=>n.attributes?.['data-keshev-refresh']!==undefined).listeners.click();await new Promise(resolve=>setTimeout(resolve,30));};
          await press();
          assert.match(textOf(current),/CPU: 30.0% 사용/);
          assert.match(textOf(current),/디스크: 확인 불가/);
          assert.match(textOf(current),/일반 사용자 권한으로 읽을 수 없습니다/);
          assert.match(textOf(current),/Windows System·Application 기록.*경고 3건 · 오류 1건/);
          await press();
          assert.match(textOf(current),/CPU 변화: \+10.0 %p/);
          assert.match(textOf(current),/메모리 사용량 변화: \+1.0 GB/);
          assert.match(textOf(current),/최근 최대 8회/);
          await press();
          assert.match(textOf(current),/이번 조회 실패\(NETWORK_ERROR\)/);
          assert.match(textOf(current),/CPU: 확인 불가/);
          assert.match(textOf(current),/과거 실측/);
          assert.equal(calls,3);
          console.log('PASS: 8 legacy renderers, appearance, no automatic fetch, PC success/permission/unavailable/history/error; no package command');
          JS
