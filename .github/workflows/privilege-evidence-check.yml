name: Temporary privilege evidence validation

on:
  push:
    branches: [fix/privilege-block-evidence-20261026]
    paths:
      - 'xdr/privilege/**'
      - 'xdr/fixtures/privilege.json'
      - 'test/privilege.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/privilege-evidence-check.yml'

permissions:
  contents: read

jobs:
  privilege:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run privilege tests
        run: npm run privilege:test
      - name: Run privilege classifier
        run: npm run xdr:run -- privilege
      - name: Run response simulation
        run: node xdr/privilege/respond.mjs
