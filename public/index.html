<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BYTE BACK | 보호 중인 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 860px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d6a24c; border-radius: 14px; color: #fff0ce; background: #61451b44; }
    #status { margin: 22px 0; color: #bfd0e5; }
    #notes { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; padding: 0; }
    .note-card { min-width: 0; border: 1px solid #51667c; border-radius: 14px; padding: 18px 19px; background: #1a2a3d; }
    .note-card strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .note-card span { color: #bfd0e5; line-height: 1.65; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 2단계 자료 보호</div>
    <h1>보호 중인 자료실</h1>
    <p>화면은 서버 API를 통해 학습용 데이터베이스에서 가상 메모를 가져옵니다. 메모 본문은 공개 정적 파일에 포함하지 않습니다.</p>
    <div class="notice">
      실습상의 알려진 약점: <code>/api/notes</code>는 공개 주소이며 아직 로그인이나 호출자 인증을 요구하지 않습니다.
      이 API에는 가상 자료만 사용하세요.
    </div>
    <p id="status" role="status" aria-live="polite">가상 메모를 불러오는 중입니다.</p>
    <ul id="notes" aria-label="가상 메모 목록"></ul>
  </main>
  <script type="module">
    const status = document.querySelector('#status');
    const list = document.querySelector('#notes');

    try {
      const response = await fetch('/api/notes', {
        method: 'GET',
        cache: 'no-store',
        headers: { Accept: 'application/json' },
      });
      if (!response.ok) throw new Error('notes_unavailable');

      const data = await response.json();
      if (!Array.isArray(data.notes) || data.notes.length !== 4
          || data.notes.some(note => typeof note?.title !== 'string'
            || typeof note?.content !== 'string')) {
        throw new Error('invalid_notes_response');
      }

      const cards = data.notes.map(note => {
        const item = document.createElement('li');
        item.className = 'note-card';
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.content;
        item.append(title, content);
        return item;
      });
      list.replaceChildren(...cards);
      status.hidden = true;
    } catch {
      status.textContent = '메모를 불러오지 못했습니다. Vercel 환경변수와 서버 API 설정을 확인해 주세요.';
      list.replaceChildren();
    }
  </script>
</body>
</html>
